        .error__404 {
            min-width: 50vh;
            max-height: 90%;
            margin-top: 10vh;
            -webkit-animation: fadeIn 1s ease-in;
            animation: fadeIn 1s ease-in
        }

        .error__text {
            position: relative;
            width: 100%;
            text-align: center
        }

        .error__title {
            font-size: 36px;
            line-height: 48px;
            height: 48px;
            color: #fff;
            margin: 33px 0 30px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .error__content {
            font-size: 18px;
            line-height: 30px;
            height: 30px;
            color: #8c93a3;
            opacity: .8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .error__star {
            display: block;
            width: 32px;
            height: 32px;
            margin: 20px auto 25px
        }

        .error__pic--1000 {
            height: 25vh
        }

        @media screen and (max-height:700px) {
            .error__title {
                margin: 24px 0 12px;
                font-size: 22px;
                line-height: 30px
            }

            .error__content {
                font-size: 16px;
                line-height: 24px
            }

            .error__star {
                width: 22px;
                height: 22px
            }
        }

        @media screen and (max-height:500px) {
            .error__sen {
                display: none
            }
        }

        /* Cloudflare Error Box Styles */
        .cf-error-box {
            margin: 20px auto;
            text-align: center;
            max-width: 600px;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .cf-error-box h1 {
            display: none;
        }

        .cf-error-box p {
            font-size: 16px;
            line-height: 24px;
            color: #8c93a3;
            opacity: .8;
            margin: 10px 0;
        }

        .cf-error-box ul {
            list-style: none !important;
            padding: 0;
            margin: 15px 0;
        }

        .cf-error-box li {
            font-size: 14px;
            line-height: 22px;
            color: #8c93a3;
            opacity: .6;
            list-style: none !important;
        }

        .cf-error-box li::before {
            display: none !important;
        }

            .error-index {
                background: #393b40;
                padding: 4px
            }
